services:
  - type: web
    name: ocheredko-api
    runtime: python
    rootDir: project
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn project.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
